name: Social Auto-Post Scheduler

# Fires the publisher endpoint once. The endpoint itself decides what is "due"
# (status=scheduled AND scheduled_at <= now).
#
# MANUAL ONLY. The every-15-min schedule runs on cron-job.org (see
# SOCIAL-SETUP.md §8). GitHub disables scheduled workflows after 60 days
# without a commit, which stopped auto-posting in Aug 2026.
#
# Requires repo secret CRON_SECRET (Settings → Secrets and variables → Actions),
# matching the CRON_SECRET env var set in Vercel.

on:
  workflow_dispatch:          # manual runs from the Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger social-publish
        run: |
          curl -fsS --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://capellanservicio.com/api/cron/social-publish"
