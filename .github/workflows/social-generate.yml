name: Social Wisdom Generator

# Generates one auto-care "word of wisdom" post and schedules it at the next
# best slot. The social-cron.yml publisher then posts it to FB + IG.
#
# MANUAL ONLY. The Tue/Fri schedule runs on cron-job.org (see SOCIAL-SETUP.md §8).
# GitHub disables scheduled workflows after 60 days without a commit, which
# stopped auto-posting in Aug 2026. Do NOT re-add a `schedule:` trigger here,
# or cron-job.org and GitHub will both generate a post on the same day.
#
# Requires repo secret CRON_SECRET (same value as Vercel).

on:
  workflow_dispatch:           # manual runs from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate wisdom post
        run: |
          curl -fsS --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://capellanservicio.com/api/cron/social-generate"
